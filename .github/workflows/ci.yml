name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: msguser
          POSTGRES_PASSWORD: msgpass123
          POSTGRES_DB: messaging_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U msguser -d messaging_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter messenger-api
      - run: pnpm prisma generate
      - run: pnpm typecheck
      - run: pnpm test

  client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter messaging-client
      - run: pnpm -C client typecheck
      - run: pnpm -C client test
      - run: pnpm -C client build
