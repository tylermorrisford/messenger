name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency: deploy

permissions:
  contents: read
  id-token: write

env:
  REGION: ${{ vars.GCP_REGION || 'us-central1' }}
  ZONE: ${{ vars.GCP_ZONE || 'us-central1-a' }}
  CLUSTER: ${{ vars.GKE_CLUSTER || 'messenger' }}

jobs:
  deploy:
    # skipped until bootstrap.sh has run and the variables are set
    if: vars.GCP_PROJECT_ID != '' && (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - run: |
          echo "SHA=${{ github.event.workflow_run.head_sha || github.sha }}" >> "$GITHUB_ENV"
          echo "REGISTRY=$REGION-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/messenger" >> "$GITHUB_ENV"

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGION }}-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.auth_token }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/api:${{ env.SHA }}
            ${{ env.REGISTRY }}/api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ env.CLUSTER }}
          location: ${{ env.ZONE }}

      - run: |
          sed -i "s|__REGISTRY__|$REGISTRY|g; s|__TAG__|$SHA|g" deploy/k8s/overlays/prod/kustomization.yaml
          kubectl apply -k deploy/k8s/overlays/prod
          kubectl rollout status deployment/api -n messenger --timeout=5m
