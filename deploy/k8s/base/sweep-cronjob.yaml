apiVersion: batch/v1
kind: CronJob
metadata:
  name: sweep
spec:
  schedule: "*/5 * * * *"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 120
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 240
      template:
        spec:
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
          containers:
            - name: sweep
              image: api
              command: ["node", "dist/jobs/sweep.js"]
              env:
                - name: NODE_ENV
                  value: production
              envFrom:
                - secretRef:
                    name: messenger-db
                - secretRef:
                    name: messenger-api
                - configMapRef:
                    name: messenger-config
              resources:
                requests:
                  cpu: 20m
                  memory: 96Mi
                limits:
                  memory: 192Mi
