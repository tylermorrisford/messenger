version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: messaging-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: msguser
      POSTGRES_PASSWORD: msgpass123
      POSTGRES_DB: messaging
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U msguser -d messaging"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
